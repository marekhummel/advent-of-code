[tool.ruff]
cache-dir = "build/python/ruff"
extend-exclude = ["test/", "scripts/", "build/"]
line-length = 99

[tool.ruff.lint]
extend-select = ["F", "E", "W", "I", "N", "LOG", "SIM", "UP"]
extend-ignore = [
    "E203", # Whitespace before :
    "E741", # Allow usage of ambigious variable names (i, l, o)
    "E731", # Allow assignment of lambda function
    "SIM102", # Allow nested ifs, even though they could be merged with an AND
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"] # Allow unused and star imports in init files

[tool.ruff.lint.isort]
known-first-party = ["lib", "solutions"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
cache_dir = "build/python/mypy"
python_version = "3.15"
# Note: Multiple year directories have conflicting 'python' module names.
# Check each year separately: MYPYPATH=src/2023/python mypy src/lib/python src/2023/python
#                         or: MYPYPATH=src/2025/python mypy src/lib/python src/2025/python
# Use task check LANG=python to check all years at once.

[[tool.mypy.overrides]]
module = ["pulp"]
ignore_errors = true
ignore_missing_imports = true
