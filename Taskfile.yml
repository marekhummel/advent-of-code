version: '3'

vars:
  PYTHON: '{{.PYTHON | default "python3"}}'
  OPTIMIZE: '{{.OPTIMIZE | default "fast"}}'
  LANG: ''

env:
  PYTHONPATH: '{{.ROOT_DIR}}/src'
  PYTHONPYCACHEPREFIX: '{{.ROOT_DIR}}/build/python/pycache'
  GOCACHE: '{{.ROOT_DIR}}/build/golang/cache'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  MIX_BUILD_PATH: '{{.ROOT_DIR}}/build/elixir/build'
  MIX_DEPS_PATH: '{{.ROOT_DIR}}/build/elixir/deps'
  ZIG_LOCAL_CACHE_DIR: '{{.ROOT_DIR}}/build/zig/cache'
  ZIG_GLOBAL_CACHE_DIR: '{{.ROOT_DIR}}/build/zig/global'

tasks:
  default:
    cmds: [task --list]

  # Common
  build:
    desc: Build a year (LANG, YEAR)
    cmds: [{task: 'build:{{.LANG}}'}]
  run:
    desc: Run a year or day (LANG, YEAR, optional DAY, PART, MODE=real/sample/both; default both)
    cmds:
      - >-
        task --silent build LANG={{.LANG | shellQuote}} YEAR={{.YEAR | shellQuote}}
        DAY={{.DAY | default "" | shellQuote}}
        OPTIMIZE={{.OPTIMIZE | shellQuote}} >&2 &&
        bash scripts/run.sh "{{.LANG}}" "{{.YEAR}}" "{{.DAY}}" "{{.PART}}"
        "{{.MODE | default "both"}}" --optimize {{.OPTIMIZE | shellQuote}}
  verify:
    desc: Verify one part (LANG, YEAR, DAY, PART, optional MODE=real/sample/both; default both)
    cmds:
      - >-
        task --silent build LANG={{.LANG | shellQuote}} YEAR={{.YEAR | shellQuote}}
        DAY={{.DAY | default "" | shellQuote}}
        OPTIMIZE={{.OPTIMIZE | shellQuote}} >&2 &&
        {{.PYTHON}} scripts/verify.py "{{.LANG}}" "{{.YEAR}}" "{{.DAY}}" "{{.PART}}"
        "{{.MODE | default "both"}}" --optimize {{.OPTIMIZE | shellQuote}}
  check:
    desc: Format and check a language (LANG, optional YEAR)
    cmds: [{task: 'check:{{.LANG}}'}]
  list:
    desc: List year/language directories (optional LANG and YEAR)
    cmds:
      - 'find src/{{.YEAR | default "[0-9]*"}} -mindepth 1 -maxdepth 1 -type d {{if .LANG}}-name {{.LANG | shellQuote}}{{end}} | sort'

  # Prep
  newday:
    desc: Create and register a day from its template (LANG, YEAR, DAY)
    cmds: ['{{.PYTHON}} scripts/new_day.py {{.LANG}} {{.YEAR}} {{.DAY}}']
  input:
    desc: Download inputs explicitly (YEAR, optional DAY)
    cmds: ['bash scripts/download_inputs.sh {{.YEAR}} "{{.DAY}}"']
  cookie:
    desc: Import a Firefox session (run on the host with Firefox closed)
    cmds: ['{{.PYTHON}} scripts/read_cookie.py']


  # ---

  # Rust
  build:rust:
    cmds: ['cargo build --locked {{if ne .OPTIMIZE "debug"}}--release {{end}}--bin main{{.YEAR}}']
  check:rust:
    cmds:
      - rustfmt --edition 2021 src/{{.YEAR | default "[0-9]*"}}/rust/main.rs src/lib/rust/aoc_lib.rs
      - cargo clippy --locked {{if .YEAR}}--bin main{{.YEAR}}{{else}}--all-targets{{end}} -- -D warnings

  # Python
  build:python:
    cmds: ['sudo python3.15 -m pip install --quiet --break-system-packages --root-user-action ignore -r requirements.txt']
  check:python:
    vars:
      DIRS:
        sh: 'printf "%s " src/{{if .YEAR}}{{.YEAR | shellQuote}}{{else}}[0-9]*{{end}}/python'
    cmds:
      - ruff format src/{{.YEAR | default "[0-9]*"}}/python src/lib/python scripts/*.py scripts/templates/*.py
      - ruff check src/{{.YEAR | default "[0-9]*"}}/python src/lib/python scripts/*.py scripts/templates/*.py
      - for: {var: DIRS}
        cmd: 'MYPYPATH={{.ITEM | shellQuote}} mypy src/lib/python {{.ITEM}}'

  # Go
  build:golang:
    cmds: ['go build {{if eq .OPTIMIZE "debug"}}-gcflags="all=-N -l" {{end}}-o build/golang/bin/main{{.YEAR}} ./src/{{.YEAR}}/golang']
  check:golang:
    vars:
      PACKAGES: '{{if .YEAR}}./src/{{.YEAR}}/golang/... ./src/lib/golang/...{{else}}./...{{end}}'
    cmds:
      - gofmt -w src/{{.YEAR | default "[0-9]*"}}/golang src/lib/golang
      - go vet {{.PACKAGES}}
      - golangci-lint run {{.PACKAGES}}
      - go test {{.PACKAGES}}

  # Zig
  build:zig:
    cmds:
      - 'zig build --pkg-dir build/zig/packages --cache-dir build/zig/cache --prefix build/zig/out -Doptimize={{.OPTIMIZE | shellQuote}} {{if .DAY}}-Dday={{.DAY | shellQuote}} {{end}}{{.YEAR}}_main'
  check:zig:
    cmds: ['zig fmt src/{{.YEAR | default "[0-9]*"}}/zig src/lib/zig build.zig']

  # Elixir
  build:elixir:
    label: 'build:elixir:{{.YEAR}}'
    method: timestamp
    sources:
      - src/lib/elixir/**/*.ex
      - src/{{.YEAR}}/elixir/**/*.ex
      - Taskfile.yml
    generates:
      - build/elixir/{{.YEAR}}/Elixir.Main.beam
      - build/elixir/{{.YEAR}}/.compiled
    cmds:
      - mkdir -p "build/elixir/{{.YEAR}}"
      - rm -f "build/elixir/{{.YEAR}}"/*.beam "build/elixir/{{.YEAR}}/.compiled"
      - elixirc -o "build/elixir/{{.YEAR}}" src/lib/elixir/*.ex src/{{.YEAR}}/elixir/solutions/*.ex src/{{.YEAR}}/elixir/main.ex
      - touch "build/elixir/{{.YEAR}}/.compiled"
  check:elixir:
    cmds:
      - mix deps.get
      - mix format mix.exs "src/{{.YEAR | default "[0-9]*"}}/elixir/**/*.{ex,exs}" "src/lib/elixir/**/*.{ex,exs}"
      - mix compile --force --all-warnings
      - mix dialyzer
