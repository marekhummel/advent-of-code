version: '3'

vars:
  PYTHON: '{{.PYTHON | default "python3"}}'
  LANG: ''

env:
  PYTHONPATH: '{{.ROOT_DIR}}/src'
  PYTHONPYCACHEPREFIX: '{{.ROOT_DIR}}/build/python/pycache'
  GOCACHE: '{{.ROOT_DIR}}/build/golang/cache'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  MIX_BUILD_PATH: '{{.ROOT_DIR}}/build/elixir/build'
  MIX_DEPS_PATH: '{{.ROOT_DIR}}/build/elixir/deps'
  ZIG_LOCAL_CACHE_DIR: '{{.ROOT_DIR}}/build/zig/cache'
  ZIG_GLOBAL_CACHE_DIR: '{{.ROOT_DIR}}/build/zig/global'

tasks:
  # Common
  default:
    cmds: [task --list]
  build:
    desc: Build a year (LANG, YEAR)
    cmds: [{task: 'build:{{.LANG}}'}]
  run:
    desc: Run a year or day (LANG, YEAR, optional DAY, PART, SAMPLE)
    cmds:
      - >-
        {{if eq .LANG "golang"}}go run ./src/{{.YEAR}}/golang/day{{printf "%02d" (atoi .DAY)}}{{else}}
        task --silent build LANG={{.LANG | shellQuote}} YEAR={{.YEAR | shellQuote}} >&2 &&
        bash scripts/run.sh "{{.LANG}}" "{{.YEAR}}" "{{.DAY}}" "{{.PART}}"
        {{if eq (.SAMPLE | default "false") "true"}}--sample{{end}}{{end}}
  verify:
    desc: Verify one part (LANG, YEAR, DAY, PART, optional SAMPLE)
    cmds:
      - >-
        task --silent build LANG={{.LANG | shellQuote}} YEAR={{.YEAR | shellQuote}} >&2 &&
        {{.PYTHON}} scripts/verify.py "{{.LANG}}" "{{.YEAR}}" "{{.DAY}}" "{{.PART}}"
        {{if eq (.SAMPLE | default "false") "true"}}--sample{{end}}
  check:
    desc: Format and check a language (LANG, optional YEAR)
    cmds: [{task: 'check:{{.LANG}}'}]
  list:
    desc: List year/language directories (optional LANG and YEAR)
    cmds:
      - 'find src/{{.YEAR | default "[0-9]*"}} -mindepth 1 -maxdepth 1 -type d {{if .LANG}}-name {{.LANG | shellQuote}}{{end}} | sort'
  doctor:
    desc: Check required local binaries (optional LANG)
    cmds: ['bash scripts/doctor.sh {{.LANG | shellQuote}} {{.PYTHON | shellQuote}}']
  new:day:
    desc: Create and register a day from its template (LANG, YEAR, DAY)
    cmds: ['{{.PYTHON}} scripts/new_day.py {{.LANG}} {{.YEAR}} {{.DAY}}']
  input:
    desc: Download inputs explicitly (YEAR, optional DAY)
    cmds: ['bash scripts/download_inputs.sh {{.YEAR}} "{{.DAY}}"']
  cookie:
    desc: Import a Firefox session into the ignored local credential file
    cmds: ['{{.PYTHON}} scripts/read_cookie.py']
  # Rust
  build:rust:
    cmds: ['cargo build --locked --release --bin main{{.YEAR}}']
  check:rust:
    cmds:
      - rustfmt --edition 2021 src/{{.YEAR | default "[0-9]*"}}/rust/main.rs src/lib/rust/aoc_lib.rs
      - cargo clippy --locked {{if .YEAR}}--bin main{{.YEAR}}{{else}}--all-targets{{end}} -- -D warnings

  # Python
  build:python:
    status:
      - |
        interpreter=$(poetry env info --executable) &&
          "$interpreter" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 15) or sys.prefix == sys.base_prefix)'
    cmds:
      - poetry env use python3.15
      - poetry install
  check:python:
    vars:
      DIRS:
        sh: 'printf "%s " src/{{if .YEAR}}{{.YEAR | shellQuote}}{{else}}[0-9]*{{end}}/python'
    cmds:
      - ruff format src/{{.YEAR | default "[0-9]*"}}/python src/lib/python scripts/*.py scripts/templates/*.py
      - ruff check src/{{.YEAR | default "[0-9]*"}}/python src/lib/python scripts/*.py scripts/templates/*.py
      - for: {var: DIRS}
        cmd: 'MYPYPATH={{.ITEM | shellQuote}} mypy src/lib/python {{.ITEM}}'

  # Go
  build:golang:
    cmds: ['go build -o build/golang/bin/{{.YEAR}}/ ./src/{{.YEAR}}/golang/...']
  check:golang:
    vars:
      PACKAGES: '{{if .YEAR}}./src/{{.YEAR}}/golang/... ./src/lib/golang/...{{else}}./...{{end}}'
    cmds:
      - gofmt -w src/{{.YEAR | default "[0-9]*"}}/golang src/lib/golang
      - go vet {{.PACKAGES}}
      - go test {{.PACKAGES}}

  # Zig
  build:zig:
    cmds:
      - 'zig build --pkg-dir build/zig/packages --cache-dir build/zig/cache --prefix build/zig/out -Doptimize=fast {{.YEAR}}_main'
  check:zig:
    cmds: ['zig fmt src/{{.YEAR | default "[0-9]*"}}/zig src/lib/zig build.zig']

  # Elixir
  build:elixir:
    cmds: ['echo "Elixir runs as a script; no build needed."']
  check:elixir:
    cmds: ['mix format "src/{{.YEAR | default "[0-9]*"}}/elixir/**/*.{ex,exs}" "src/lib/elixir/**/*.{ex,exs}"']
