[package]
name = "adventofcode-rust"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "main2024"
path = "src/2024/rust/main.rs"

[[bin]]
name = "main2023"
path = "src/2023/rust/main.rs"

[[bin]]
name = "main2022"
path = "src/2022/rust/main.rs"

[[bin]]
name = "main2021"
path = "src/2021/rust/main.rs"

[[bin]]
name = "main2020"
path = "src/2020/rust/main.rs"

[[bin]]
name = "main2019"
path = "src/2019/rust/main.rs"

[[bin]]
name = "main2018"
path = "src/2018/rust/main.rs"

[[bin]]
name = "main2017"
path = "src/2017/rust/main.rs"

[[bin]]
name = "main2016"
path = "src/2016/rust/main.rs"

[[bin]]
name = "main2015"
path = "src/2015/rust/main.rs"

[lib]
name = "aoc_lib"
path = "src/lib/rust/aoc_lib.rs"

[lints.clippy]
needless_range_loop = { level = "allow", priority = 0 }
never_loop = { level = "warn", priority = 0 }
if_same_then_else = { level = "warn", priority = 0 }
multiple_bound_locations = { level = "allow", priority = 0 }
collapsible_if = "allow"

[dependencies]
regex = "1"
itertools = "0.15.0"
md5 = "0.8.1"
rayon = "1.12.0"
num = { version = "0.4.3", features = ["num-bigint"] }
serde_json = "1.0.154"
clap = { version = "4.6", features = ["derive"] }
